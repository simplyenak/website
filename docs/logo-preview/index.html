<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Culinary Travel Experts — Logo Preview</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #FDF8F3; color: #2A2015; }
  h1 { font-size: 20px; padding: 24px 32px 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 16px 32px 48px; }
  .cell { border: 1px solid #e5d8c8; border-radius: 12px; padding: 24px; background: #fff; }
  .cell h2 { font-size: 14px; margin: 0 0 12px; color: #6B5036; letter-spacing: 0.06em; text-transform: uppercase; }
  .panel { display: flex; align-items: center; justify-content: center; min-height: 220px; border-radius: 8px; }
  .cream { background: #FDF8F3; }
  .dark  { background: #2A2015; }
  svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<h1>Culinary Travel Experts — Logo variants (wok-steam-path concept)</h1>
<div class="grid">
  <div class="cell">
    <h2>Square emblem (light)</h2>
    <div class="panel cream"><img src="cte-mark.svg" alt="mark"></div>
  </div>
  <div class="cell">
    <h2>Square emblem (dark)</h2>
    <div class="panel dark"><img src="cte-mark-dark.svg" alt="mark dark"></div>
  </div>
  <div class="cell">
    <h2>Square lockup (light)</h2>
    <div class="panel cream"><img src="cte-logo-square.svg" alt="square lockup"></div>
  </div>
  <div class="cell">
    <h2>Horizontal lockup (light)</h2>
    <div class="panel cream"><img src="cte-logo-horizontal.svg" alt="horizontal"></div>
  </div>
  <div class="cell">
    <h2>Horizontal lockup (dark)</h2>
    <div class="panel dark"><img src="cte-logo-horizontal-dark.svg" alt="horizontal dark"></div>
  </div>
  <div class="cell">
    <h2>Contact sheet (PNG)</h2>
    <div class="panel cream"><img src="preview.png" alt="contact sheet" style="width:100%"></div>
  </div>
</div>
</body>
</html>
