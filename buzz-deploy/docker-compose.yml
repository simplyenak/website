version: "3.8"

# Buzz relay — production deployment for Simply Enak server (Docker Swarm)
# Deployed via: docker stack deploy -c docker-compose.yml production-buzz
# Not a Dokploy-managed compose project (no sudo); deployed directly via Swarm.

services:
  relay:
    image: ${BUZZ_IMAGE:-ghcr.io/block/buzz:main}
    env_file:
      - .env
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buzz}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_GIT_CONFORMANCE_PROBE: "true"
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_ALLOW_NIP_OA_AUTH: "true"
      RELAY_OWNER_PUBKEY: ${RELAY_OWNER_PUBKEY}
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY}
      BUZZ_GIT_HOOK_HMAC_SECRET: ${BUZZ_GIT_HOOK_HMAC_SECRET}
      BUZZ_DOMAIN: ${BUZZ_DOMAIN}
      RELAY_URL: ${RELAY_URL}
      BUZZ_MEDIA_BASE_URL: ${BUZZ_MEDIA_BASE_URL}
      BUZZ_MEDIA_SERVER_DOMAIN: ${BUZZ_MEDIA_SERVER_DOMAIN}
      BUZZ_CORS_ORIGINS: ${BUZZ_CORS_ORIGINS}
      RUST_LOG: ${RUST_LOG}
    volumes:
      - buzz-git-data:/data/git
    networks:
      buzz-net:
        aliases:
          - buzz-relay
      dokploy-network:
    deploy:
      restart_policy:
        condition: any
        delay: 10s
      labels:
        - traefik.enable=true
        - traefik.swarm.lbswarm=true
        - traefik.swarm.network=dokploy-network
        # HTTP -> HTTPS redirect
        - traefik.http.routers.buzz-web.rule=Host(`buzz.system.simplyenak.com`)
        - traefik.http.routers.buzz-web.entrypoints=web
        - traefik.http.routers.buzz-web.middlewares=redirect-to-https@file
        - traefik.http.routers.buzz-web.service=buzz-web
        # HTTPS
        - traefik.http.routers.buzz-websecure.rule=Host(`buzz.system.simplyenak.com`)
        - traefik.http.routers.buzz-websecure.entrypoints=websecure
        - traefik.http.routers.buzz-websecure.tls=true
        - traefik.http.routers.buzz-websecure.tls.certresolver=letsencrypt
        - traefik.http.routers.buzz-websecure.service=buzz-web
        - traefik.http.services.buzz-web.loadbalancer.server.port=3000
      resources:
        limits:
          memory: 1G

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buzz}
      POSTGRES_USER: ${POSTGRES_USER:-buzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - buzz-postgres-data:/var/lib/postgresql/data
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buzz}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - buzz-redis-data:/data
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BUZZ_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BUZZ_S3_SECRET_KEY}
    volumes:
      - buzz-minio-data:/data
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 "$$BUZZ_S3_ACCESS_KEY" "$$BUZZ_S3_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$BUZZ_S3_BUCKET" &&
        mc anonymous set none "local/$$BUZZ_S3_BUCKET"
      '
    networks:
      - buzz-net
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
      replicas: 1

networks:
  buzz-net:
    driver: overlay
  dokploy-network:
    external: true
    name: dokploy-network

volumes:
  buzz-postgres-data:
  buzz-redis-data:
  buzz-minio-data:
  buzz-git-data: