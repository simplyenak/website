# =============================================================================
# Hermes Agent + MemPalace MCP Proxy + Hermes Workspace - Docker Compose for Dokploy
#
# Services:
#   1. hermes (agent) - Telegram gateway + API server + dashboard
#   2. mempalace-proxy - MCP server exposed via Traefik
#   3. hermes-workspace - web UI (ghcr.io/outsourc-e/hermes-workspace:latest)
#
# Security: no host ports, Traefik TLS routing, basic auth on dashboard
# Traefik configs: hermes-agent-traefik.yml, workspace-traefik.yml, mempalace-traefik.yml
# DNS: hermes.system.simplyenak.com, workspace.system.simplyenak.com, mempalace.system.simplyenak.com
#
# 🔴 DURABILITY: This compose file IS the source of truth for the Hermes service.
# Dokploy deploys from this file. Env vars marked ${SECRET_NAME} MUST be set in
# Dokploy's project environment variables UI — they WILL NOT resolve from a .env
# file during stack deploy. Without them, the service starts but can't auth.
#
# Required Dokploy project env vars (set in Dokploy UI → project → env):
#   TELEGRAM_BOT_TOKEN      — BotFather token
#   TELEGRAM_WEBHOOK_SECRET — bot webhook secret
#   TELEGRAM_ALLOWED_USERS  — Your Telegram user ID
#   OPENCODE_GO_API_KEY     — OpenCode API key (set BOTH this and OPENCODE_API_KEY)
#   OPENCODE_API_KEY        — Same key, Hermes reads this for built-in provider
#   OMNIROUTE_API_KEY       — Omniroute gateway key
#   BRILLIANT_API_KEY       — Brilliant KB MCP key
#   HERMES_WORKSPACE_PASSWORD — Web dashboard password
#   API_SERVER_KEY          — API server auth key (if API_SERVER_ENABLED=true)
#
# Everything else is hardcoded here and survives redeploy.
# =============================================================================

services:
  hermes:
    image: ghcr.io/simplyenak/website/hermes-agent:latest
    # 🔴 :latest is updated on every deploy. Roll back with:
    #    bash scripts/deploy-hermes.sh --rollback
    # For reproducible builds, pin to a specific digest:
    #   image: ghcr.io/simplyenak/website/hermes-agent@sha256:DIGEST
    container_name: hermes-agent
    restart: unless-stopped

    tmpfs:
      - /tmp:noexec,nosuid,size=64m

    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

    deploy:
      labels:
        # Prevent Watchtower from auto-updating (we rebuild locally)
        - com.centurylinklabs.watchtower.enable=false
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M
          pids: 50
        reservations:
          cpus: "0.1"
          memory: 256M

    networks:
      - hermes-network-enc
      - hermes-services-enc
      - dokploy-network

    volumes:
      # Persistent storage - agent data, sessions, skills, memory, backups
      - hermes-data:/home/hermes/.hermes
      # Workspace for agent scratch space
      - hermes-workspace:/home/hermes/workspace
      # MemPalace memory store
      - mempalace-data:/home/hermes/.mempalace
      # Website repo - read-only so agent can read content for updates
      - /var/home/maarten/website-optimization/website:/home/hermes/workspace/website:ro
      # SSH deploy key for git operations (read-only)
      - /home/maarten/.ssh/id_ed25519:/home/hermes/.ssh/deploy_key:ro
      - /home/maarten/.ssh/id_ed25519.pub:/home/hermes/.ssh/deploy_key.pub:ro
      - /home/maarten/.ssh/known_hosts:/home/hermes/.ssh/known_hosts:ro
      # SSH config for deploy key routing
      - ./config/ssh_config:/home/hermes/.ssh/config:ro

    environment:
      # ── Required Dokploy project env vars ──
      # Set these in Dokploy UI → project → environment variables
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?set in Dokploy env}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY}
      - BRILLIANT_API_KEY=${BRILLIANT_API_KEY}
      - HERMES_WORKSPACE_PASSWORD=${HERMES_WORKSPACE_PASSWORD}
      - API_SERVER_KEY=${API_SERVER_KEY}

      # ── Durable (hardcoded) env vars ──
      # These survive redeploy and server reset
      - OMNIROUTE_URL=http://omniroute:20129/v1
      - TELEGRAM_WEBHOOK_URL=https://hermes.system.simplyenak.com/telegram
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:?set in Dokploy env}
      - HERMES_TELEGRAM_DISABLE_FALLBACK_IPS=true
      - API_SERVER_ENABLED=false
      - API_SERVER_HOST=0.0.0.0
      - GATEWAY_ALLOW_ALL_USERS=false
      - WEBHOOK_ENABLED=true
      - WEBHOOK_PORT=8644
      - WEBHOOK_SECRET=***REMOVED***
      - TZ=Asia/Kuala_Lumpur
      - MEMPALACE_URL=http://mempalace-proxy:3456/mcp
      - MEMPALACE_TIMEOUT=60
      - BRILLIANT_MCP_URL=http://brilliant-mcp:8002/mcp
      - BRILLIANT_URL=http://cortex-api:8000
      - SEARXNG_URL=http://searxng:8080
      - N8N_WEBHOOK_URL=http://production-n8n-6aryb3_n8n:5678/webhook
      - ROCKETCHAT_URL=https://rocketchat.system.simplyenak.com
      - ROCKETCHAT_USERNAME=hermes
      - ROCKETCHAT_PASSWORD=${ROCKETCHAT_PASSWORD}
      - ROCKETCHAT_ALLOWED_USERS=${ROCKETCHAT_ALLOWED_USERS}
      - ROCKETCHAT_HOME_CHANNEL=${ROCKETCHAT_HOME_CHANNEL}
      - TELEGRAM_HOME_CHANNEL=${TELEGRAM_HOME_CHANNEL}
      - GLM_API_KEY=

    healthcheck:
      test: ["CMD-SHELL", "python3 /home/hermes/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  mempalace-proxy:
    image: hermes-simplyenak-mempalace:latest
    container_name: mempalace-proxy
    restart: unless-stopped

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    networks:
      hermes-network-enc:
        aliases:
          - mempalace-proxy
      hermes-services-enc:
        aliases:
          - mempalace-proxy
      dokploy-network:
        aliases:
          - mempalace-proxy

    volumes:
      - mempalace-data:/home/mempalace/.mempalace

    deploy:
      labels:
        - com.centurylinklabs.watchtower.enable=false
      resources:
        limits:
          cpus: "0.3"
          memory: 512M

  headroom:
    build:
      context: .
      dockerfile: headroom.Dockerfile
    container_name: headroom-proxy
    restart: unless-stopped

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    environment:
      # CROFAI_API_KEY removed - no longer needed

    networks:
      hermes-network-enc:
        aliases:
          - headroom
      hermes-services-enc:
        aliases:
          - headroom
      dokploy-network:
        aliases:
          - headroom

    deploy:
      labels:
        - com.centurylinklabs.watchtower.enable=false
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M
        reservations:
          cpus: "0.1"
          memory: 256M

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped

    environment:
      - SEARXNG_BASE_URL=https://search.system.simplyenak.com/
      - SEARXNG_SECRET=secret
      - SEARXNG_BIND_ADDRESS=0.0.0.0
      - SEARXNG_PORT=8080

    volumes:
      - searxng-data:/etc/searxng

    networks:
      hermes-network-enc:
        aliases:
          - searxng

    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  brilliant-mcp:
    image: hermes-simplyenak-brilliant-mcp:latest
    container_name: brilliant-mcp
    restart: unless-stopped

    environment:
      - CORTEX_BASE_URL=http://cortex-api:8000
      - CORTEX_API_KEY=${BRILLIANT_API_KEY}
      - PORT=8002

    networks:
      hermes-services-enc:
        aliases:
          - brilliant-mcp
      dokploy-network:
        aliases:
          - brilliant-mcp-proxy

    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.2"
          memory: 256M

volumes:
  hermes-data:
    driver: local
  hermes-workspace:
    driver: local
  mempalace-data:
    external: true
    name: hermes-dokploy_mempalace-data
  searxng-data:
    driver: local

networks:
  hermes-network-enc:
    external: true
  hermes-services-enc:
    external: true
  dokploy-network:
    external: true