# =============================================================================
# Traefik routing for Brilliant MCP — brilliant-mcp.system.simplyenak.com
#
# Routes to the brilliant-mcp container (port 8002) which wraps the
# Brilliant Knowledge Base REST API as MCP tools via Streamable HTTP.
#
# Auth: Basic auth (same credentials as mempalace-proxy for consistency)
# TLS: LetsEncrypt automatic certificate
# =============================================================================

http:
  routers:
    brilliant-mcp-router-web:
      rule: "Host(`brilliant-mcp.system.simplyenak.com`)"
      service: brilliant-mcp-service
      middlewares:
        - redirect-to-https
      entryPoints:
        - web
    brilliant-mcp-router-websecure:
      rule: "Host(`brilliant-mcp.system.simplyenak.com`)"
      service: brilliant-mcp-service
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - brilliant-mcp-auth

  services:
    brilliant-mcp-service:
      loadBalancer:
        servers:
          - url: "http://brilliant-mcp:8002"
        passHostHeader: true

  middlewares:
    brilliant-mcp-auth:
      basicAuth:
        users:
          - "maarten:$apr1$A/DDaEo.$0LndHQHLZrholn74FXaF2/"
