version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - openviking-network
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  openviking:
    image: localhost:5000/openviking-server:latest
    environment:
      - OPENVIKING_WITH_BOT=0
      - OPENVIKING_CONFIG_FILE=/app/ov.conf
      - "GLM_API_KEY=***REMOVED***"
    volumes:
      - openviking-data:/data/openviking
    networks:
      - openviking-network
      - dokploy-network
    depends_on:
      - ollama
    deploy:
      labels:
        - traefik.enable=true
        - traefik.swarm.lbswarm=true
        - traefik.swarm.network=dokploy-network
        - traefik.http.middlewares.openviking-auth.basicauth.users=maarten:$$apr1$$A/DDaEo.$$0LndHQHLZrholn74FXaF2/
        - traefik.http.middlewares.openviking-auth.basicauth.realm=OpenViking Context Database
        - traefik.http.routers.openviking-web.rule=Host(`openviking.system.simplyenak.com`)
        - traefik.http.routers.openviking-web.entrypoints=web
        - traefik.http.routers.openviking-web.middlewares=redirect-to-https@file,openviking-auth
        - traefik.http.routers.openviking-web.service=openviking-web
        - traefik.http.services.openviking-web.loadbalancer.server.port=1933
        - traefik.http.routers.openviking-websecure.rule=Host(`openviking.system.simplyenak.com`)
        - traefik.http.routers.openviking-websecure.entrypoints=websecure
        - traefik.http.routers.openviking-websecure.middlewares=openviking-auth
        - traefik.http.routers.openviking-websecure.service=openviking-websecure
        - traefik.http.routers.openviking-websecure.tls.certresolver=letsencrypt
        - traefik.http.services.openviking-websecure.loadbalancer.server.port=1933
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  ollama-data:
  openviking-data:

networks:
  openviking-network:
    external: true
  dokploy-network:
    external: true
