{
  "storage": {
    "workspace": "/data/openviking"
  },
  "log": {
    "level": "INFO",
    "output": "stdout"
  },
  "embedding": {
    "dense": {
      "provider": "ollama",
      "api_base": "http://ollama:11434",
      "model": "nomic-embed-text",
      "dimension": 768
    },
    "max_concurrent": 10
  },
  "vlm": {
    "provider": "glm",
    "api_key": "${GLM_API_KEY}",
    "api_base": "https://api.z.ai/api/coding/paas/v4",
    "model": "glm-4.6v",
    "max_concurrent": 10
  }
}
