# =============================================================================
# Traefik routing for Hermes Workspace — workspace.simplyenak.com
# Separate from hermes-agent-traefik.yml to keep concerns isolated.
#
# This routes to the hermes-workspace container (port 3000) which is the
# full web UI for chat, terminal, memory, skills, and agent management.
# The workspace itself handles auth via HERMES_PASSWORD.
# =============================================================================

http:
  routers:
    # Redirect HTTP → HTTPS
    workspace-router-web:
      rule: "Host(`workspace.system.simplyenak.com`)"
      service: workspace-service
      middlewares:
        - redirect-to-https
      entryPoints:
        - web

    # HTTPS — main workspace UI
    workspace-router-websecure:
      rule: "Host(`workspace.system.simplyenak.com`)"
      service: workspace-service
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt

  services:
    workspace-service:
      loadBalancer:
        servers:
          # hermes-workspace container on port 3000 (internal Docker network)
          - url: http://hermes-workspace:3000
        passHostHeader: true
