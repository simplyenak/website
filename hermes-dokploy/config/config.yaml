# Hermes Agent Configuration — Simply Enak
# Docs: https://docs.simplyenak.com/hermes
# Server: Dokploy deployment, v2026.5.16

openai: {}

mcpServers:
  mempalace:
    url: ${MEMPALACE_URL:-http://mempalace-proxy:3456/mcp}
    headers:
      Authorization: "Basic bWFhcnRlbjpTaW1wbHlFbmFrMjAyNiE="
    connectTimeout: 30000
    timeout: 60000

  searxng:
    command: "python3"
    args:
      - "-m"
      - "mcp.server"
    env:
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}

telegram:
  webhookMode: true
  webhookUrl: ${TELEGRAM_WEBHOOK_URL}
  webhookPort: ${TELEGRAM_WEBHOOK_PORT:-8443}
  webhookSecret: ***REMOVED***
  botToken: ***REMOVED***
  allowedUsers:
    - ${TELEGRAM_ALLOWED_USERS}
  homeChannel: ${TELEGRAM_HOME_CHANNEL}

gateway:
  enabled: true
  allowAllUsers: ${GATEWAY_ALLOW_ALL_USERS:-false}

webhook:
  enabled: ${WEBHOOK_ENABLED:-true}
  port: ${WEBHOOK_PORT:-8644}
  secret: ${WEBHOOK_SECRET}

dashboard:
  port: 9119
  host: "0.0.0.0"
  insecure: false

n8n:
  webhookUrl: ${N8N_WEBHOOK_URL}

brilliant:
  mcpUrl: ${BRILLIANT_MCP_URL}
  apiUrl: ${BRILLIANT_URL}
  apiKey: ${BRILLIANT_API_KEY}

api:
  enabled: ${API_SERVER_ENABLED:-true}
  host: ${API_SERVER_HOST:-0.0.0.0}
  key: ${API_SERVER_KEY}
  key: ${API_SERVER_KEY}
  workspacePassword: ${HERMES_WORKSPACE_PASSWORD}
security:
  hard_stop_enabled: true
  tool_loop_guardrails: strict
  tirith_fail_open: false

sessions:
  auto_prune: true
  retention_days: 90
custom_providers:
 - name: GLM
   base_url: https://api.z.ai/api/coding/paas/v4
   api_key: ${GLM_API_KEY}
    model: glm-5.1

fallback_providers:
  - provider: custom:GLM
    model: glm-5.1

terminal:
  timeout: ${TERMINAL_TIMEOUT:-60}
  lifetimeSeconds: ${TERMINAL_LIFETIME_SECONDS:-180}