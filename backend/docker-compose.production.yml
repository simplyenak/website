version: '3.8'

services:
  postgres:
    image: postgres:16
    platform: linux/amd64
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - strapi-network
    restart: unless-stopped

  strapi:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      DATABASE_CLIENT: postgres
      DATABASE_SSL: false
    ports:
      - "1337:1337"
    depends_on:
      - postgres
    networks:
      - strapi-network
    restart: unless-stopped
    volumes:
      - strapi_uploads:/opt/app/public/uploads

volumes:
  postgres_data:
  strapi_uploads:

networks:
  strapi-network:
    driver: bridge
