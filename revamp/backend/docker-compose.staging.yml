services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://payload:${PAYLOAD_DB_PASSWORD}@payload-postgres:5432/payload
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - NODE_ENV=production
      - PAYLOAD_PUBLIC_SERVER_URL=${PAYLOAD_PUBLIC_SERVER_URL}
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
    depends_on:
      payload-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dokploy-network

  payload-postgres:
    image: postgres:16-alpine
    volumes:
      - payload-staging-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: payload
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: ${PAYLOAD_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dokploy-network

volumes:
  payload-staging-db:

networks:
  dokploy-network:
    external: true
