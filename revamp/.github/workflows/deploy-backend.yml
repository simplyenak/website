name: Build & Deploy Backend (Payload CMS)

on:
  push:
    branches: [ staging ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            simplyenak/website-backend:staging
            simplyenak/website-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Dokploy staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "=== Pulling staging image ==="
            docker pull simplyenak/website-backend:sha-${{ github.sha }}

            echo "=== Updating compose file ==="
            cd /etc/dokploy/compose/simplyenak-backend-7x9k2m/code
            sed -i "s|simplyenak/website-backend:.*|simplyenak/website-backend:sha-${{ github.sha }}|" docker-compose.yml

            echo "=== Redeploying stack ==="
            docker stack deploy -c docker-compose.yml simplyenak-backend --with-registry-auth

            echo "=== Cleanup old images ==="
            docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/simplyenak/revamp" 2>/dev/null || true

            echo "✅ Staging deployed: simplyenak/website-backend:sha-${{ github.sha }}"
