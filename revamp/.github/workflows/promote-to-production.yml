name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ''
      commit_sha:
        description: 'Specific commit SHA to deploy (leave empty for latest main)'
        required: false
        default: ''

env:
  REGISTRY: docker.io
  IMAGE_NAME: simplyenak/website-backend

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "❌ Confirmation must be 'deploy'. Aborting."
            exit 1
          fi

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short SHA
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=production-${{ steps.sha.outputs.SHORT_SHA }}-
            type=raw,value=production
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Deploy to production server (same machine — production compose stack)
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ steps.sha.outputs.SHORT_SHA }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 4040 }}
          envs: DEPLOY_SHA
          script: |
            echo "=== Pulling production image ==="
            docker pull simplyenak/website-backend:production-$DEPLOY_SHA

            echo "=== Updating Dokploy compose ==="
            cd /etc/dokploy/compose/simplyenak-backend-7x9k2m/code
            sed -i "s|simplyenak/website-backend:.*|simplyenak/website-backend:production-$DEPLOY_SHA|" docker-compose.yml

            echo "=== Redeploying stack ==="
            docker stack deploy -c docker-compose.yml simplyenak-backend --with-registry-auth

            echo "=== Cleanup old images ==="
            docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/simplyenak/revamp" 2>/dev/null || true

            echo "✅ Production deployed: simplyenak/website-backend:production-$DEPLOY_SHA"

      - name: Notify success
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          echo "Image: simplyenak/website-backend:production-${{ steps.sha.outputs.SHORT_SHA }}"
          echo "Image: simplyenak/website-backend:latest"
          echo "Commit: ${{ github.sha }}"