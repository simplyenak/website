name: Deploy Guide Portal to Cloudflare Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'guides/**'
      - '.github/workflows/deploy-guides.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Guide Portal
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: guides/package-lock.json

      - name: Install dependencies
        working-directory: guides
        run: npm ci

      - name: Build
        working-directory: guides
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: simply-enak-guides
          directory: guides/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main