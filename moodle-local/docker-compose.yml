services:
  moodle-db:
    image: mariadb:10.5
    container_name: moodle-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: moodleroot123
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - moodle-network

  moodle-web:
    image: jauer/moodle:latest
    container_name: moodle-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      MOODLE_URL: http://localhost:8080
      MYSQL_HOST: moodle-db
      MYSQL_PORT: 3306
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle123
      MYSQL_DATABASE: moodle
      MOODLE_ADMIN_USER: admin
      MOODLE_ADMIN_PASSWORD: admin123
      MOODLE_ADMIN_EMAIL: admin@example.com
    volumes:
      - moodle_data:/var/www/html
    depends_on:
      - moodle-db
    networks:
      - moodle-network

volumes:
  mysql_data:
  moodle_data:

networks:
  moodle-network:
    driver: bridge