name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - perf/**  # Deploy all performance optimization branches
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Astro site
        run: |
          cd frontend
          npm run build
        env:
          # Add your Strapi API URL as a GitHub secret
          PUBLIC_STRAPI_URL: ${{ secrets.STRAPI_URL || 'https://your-strapi-url.com' }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: simplyenak-website
          directory: frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Branch deployments will create preview URLs automatically
          branch: ${{ github.head_ref || github.ref_name }}

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const previewUrl = `https://${branch}.simplyenak-website.pages.dev`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployment Ready!

**Branch:** \`${branch}\`
**Preview URL:** ${previewUrl}

### Performance Testing
Test this deployment with PageSpeed Insights:
https://pagespeed.web.dev/analysis?url=${encodeURIComponent(previewUrl)}

### Next Steps
1. Visit the preview URL to test functionality
2. Run PageSpeed Insights to verify performance improvements
3. Check mobile and desktop scores

---
*This preview will be automatically updated with new commits to this PR.*`
            });
