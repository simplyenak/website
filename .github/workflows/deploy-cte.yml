name: Deploy CTE Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cte/**'
      - '.github/workflows/deploy-cte.yml'

concurrency:
  group: deploy-cte
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cte/package-lock.json

      - name: Install dependencies
        working-directory: cte
        run: npm ci

      - name: Build site
        working-directory: cte
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: culinary-travel-experts
          directory: cte/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
