name: Debug CTE Workers

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: List account-level worker scripts
        run: |
          ACCT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"

          echo "=== Account-level worker scripts ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/${ACCT_ID}/workers/scripts" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" | python3 -m json.tool

      - name: List zone-level worker routes
        run: |
          ZONE_ID="1089372d65ce125c263361f7c38a947d"
          TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"

          echo "=== Zone-level worker routes ==="
          curl -s "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" | python3 -m json.tool
