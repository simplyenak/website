name: Purge Cloudflare Cache

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "everything | tour-pages"
        required: true
        default: "tour-pages"
        type: choice
        options:
          - tour-pages
          - everything

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCOPE: ${{ github.event.inputs.scope }}
        run: |
          set -euo pipefail
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=simplyenak.com" \
            -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            | jq -r ".result[0].id")
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "null" ]; then
            echo "ERROR: could not resolve zone id (token may lack Zone:Read)"
            exit 1
          fi
          echo "Zone: $ZONE_ID, scope: $SCOPE"
          if [ "$SCOPE" = "everything" ]; then
            BODY="{\"purge_everything\":true}"
          else
            LOCALES="en ms de fr zh ja es pt ru nl"
            URLS="["
            first=1
            for loc in $LOCALES; do
              for t in kuala-lumpur-street-food flavours-of-malaysia penang-street-food georgetown-night-food-durian secrets-of-kl-nightlife-street-art-and-cocktails inside-pudu kl-vegetarian-food-tour; do
                [ "$loc" = "en" ] && p="/tours/$t/" || p="/$loc/tours/$t/"
                u="https://simplyenak.com$p"
                [ $first -eq 1 ] && first=0 || URLS+=","
                URLS+="\"$u\""
              done
            done
            URLS+="]"
            BODY="{\"files\":$URLS}"
          fi
          RESP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data "$BODY")
          echo "$RESP" | jq .
          echo "$RESP" | jq -e ".success == true" > /dev/null
