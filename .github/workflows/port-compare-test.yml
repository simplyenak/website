name: Port Compare Test (temp)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TH: ${{ secrets.SERVER_HOST }}
      TP: ${{ secrets.SERVER_PORT || '4040' }}
    steps:
      - name: Compare configured port vs 4040
        run: |
          echo "Configured port is 2 chars, value: [${TP}]"
          echo "Host is IP? [$(echo "$TH" | grep -cE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')]"
          echo "Host has dot? [$(echo "$TH" | grep -c '\.')]"
          echo "--- TCP to \$TH:\$TP ---"
          timeout 12 bash -c "echo > /dev/tcp/$TH/$TP" 2>&1 && echo "CONFIGURED PORT: OPEN" || echo "CONFIGURED PORT: FAILED"
          echo "--- TCP to \$TH:4040 ---"
          timeout 12 bash -c "echo > /dev/tcp/$TH/4040" 2>&1 && echo "PORT 4040: OPEN" || echo "PORT 4040: FAILED"
          echo "--- TCP to \$TH:22 ---"
          timeout 12 bash -c "echo > /dev/tcp/$TH/22" 2>&1 && echo "PORT 22: OPEN" || echo "PORT 22: FAILED"
