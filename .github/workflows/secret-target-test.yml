name: Secret Target Test (temp)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TH: ${{ secrets.SERVER_HOST }}
      TP: ${{ secrets.SERVER_PORT || '4040' }}
      TU: ${{ secrets.SERVER_USER }}
    steps:
      - name: Resolve and test the configured target
        run: |
          echo "Host resolves to:"
          getent ahosts "$TH" | head -3 || echo "(no DNS resolution)"
          echo "Port value length: ${#TP}"
          echo "Username length: ${#TU}"
          echo "--- TCP test to configured host:port ---"
          timeout 15 bash -c "echo > /dev/tcp/$TH/$TP" 2>&1 && echo "CONNECT: OK" || echo "CONNECT: FAILED"
          echo "--- SSH banner grab ---"
          timeout 15 bash -c "exec 3<>/dev/tcp/$TH/$TP; head -c 40 <&3" 2>&1 | head -2 || echo "(no banner)"
