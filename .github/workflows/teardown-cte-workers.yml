name: Tear Down Old CTE Workers

on:
  workflow_dispatch:

jobs:
  teardown:
    runs-on: ubuntu-latest
    name: Remove Stale CTE Worker Routes & Scripts

    steps:
      - name: Delete worker routes
        run: |
          set -euo pipefail
          ZONE_ID="1089372d65ce125c263361f7c38a947d"
          TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"

          for SCRIPT_NAME in cte-rewriter-v2 cte-insights; do
            echo "Checking routes for ${SCRIPT_NAME}..."

            ROUTES_RESP=$(curl -s "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json")

            echo "Routes response: $ROUTES_RESP"

            ROUTE_ID=$(echo "$ROUTES_RESP" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if not data.get('success'):
              print('')
              sys.exit()
          for r in data.get('result') or []:
              if r.get('script') == '${SCRIPT_NAME}':
                  print(r['id'])
          ")

            if [ -z "$ROUTE_ID" ]; then
              echo "No route found for ${SCRIPT_NAME}"
              continue
            fi

            echo "Deleting route ${ROUTE_ID}..."
            RESPONSE=$(curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes/${ROUTE_ID}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json")

            echo "Delete response: $RESPONSE"

            SUCCESS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success',False))")
            if [ "$SUCCESS" != "True" ]; then
              echo "::error::Failed to delete route: $RESPONSE"
              exit 1
            fi
            echo "Deleted route for ${SCRIPT_NAME}"
          done

      - name: Delete worker scripts
        run: |
          set -euo pipefail
          ACCT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"

          for SCRIPT_NAME in cte-rewriter-v2 cte-insights; do
            echo "Deleting worker script ${SCRIPT_NAME}..."
            RESPONSE=$(curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/${ACCT_ID}/workers/scripts/${SCRIPT_NAME}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json")

            echo "Response: $RESPONSE"

            SUCCESS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success',False))")
            if [ "$SUCCESS" == "True" ]; then
              echo "Deleted script ${SCRIPT_NAME}"
            else
              echo "Could not delete script ${SCRIPT_NAME} (may not exist)"
            fi
          done
