name: Deploy Site

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      message:
        description: 'Deployment message'
        required: false
        default: 'Deploy site update'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'eval/**'
      - '.github/workflows/deploy-site.yml'
  repository_dispatch:
    types: [deploy-staging, deploy-production]
  schedule:
    # Auto-sync from Payload every 30 minutes — deploys to both staging + production
    - cron: '*/30 * * * *'

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Sync, Build and Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Quality gate (content pipeline eval)
        run: python3 eval/content-eval-runner.py --json
        # Exit 0 = all pass. Exit 1 = failure — blocks deploy.

      - name: Push translations to Payload CMS
        working-directory: site
        run: |
          node scripts/push-translations-payload.mjs 2>&1 || echo "⚠️ Push failed (non-fatal)"
        env:
          PAYLOAD_URL: https://cms.system.simplyenak.com
          PAYLOAD_EMAIL: ${{ secrets.PAYLOAD_EMAIL }}
          PAYLOAD_PASSWORD: ${{ secrets.PAYLOAD_PASSWORD }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Create .env from secrets
        working-directory: site
        run: |
          cat > .env <<'EOF'
          PAYLOAD_URL=https://cms.system.simplyenak.com
          PAYLOAD_TOKEN=${{ secrets.PAYLOAD_TOKEN }}
          PAYLOAD_EMAIL=${{ secrets.PAYLOAD_EMAIL }}
          PAYLOAD_PASSWORD=${{ secrets.PAYLOAD_PASSWORD }}
          PUBLIC_SITE_URL=https://simplyenak.com
          EOF

      - name: Sync content from Payload CMS
        working-directory: site
        run: npm run sync

      - name: Build site
        working-directory: site
        run: npm run build
        env:
          PAYLOAD_URL: https://cms.system.simplyenak.com

      - name: Deploy to staging
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: staging
          directory: site/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: Deploy to production
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: website
          directory: site/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: production
