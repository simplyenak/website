name: Deploy Site

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      message:
        description: 'Deployment message'
        required: false
        default: 'Deploy site update'
  repository_dispatch:
    types: [deploy-staging, deploy-production]
  push:
    branches: [main]
    paths:
      - 'site/**'
  schedule:
    # Daily 09:00 UTC safety net — syncs from Payload, builds, deploys
    - cron: '0 9 * * *'

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Sync, Build and Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Quality gate (content pipeline eval)
        run: python3 eval/content-eval-runner.py --json
        # Exit 0 = all pass. Exit 1 = failure — blocks deploy.

      - name: Setup Python
        run: python3 -m pip install --quiet requests || true

      - name: Create .env from secrets
        working-directory: site
        run: |
          cat > .env <<'EOF'
          PAYLOAD_URL=https://cms.system.simplyenak.com
          PAYLOAD_TOKEN=${{ secrets.PAYLOAD_TOKEN }}
          PAYLOAD_EMAIL=${{ secrets.PAYLOAD_EMAIL }}
          PAYLOAD_PASSWORD=${{ secrets.PAYLOAD_PASSWORD }}
          PAYLOAD_ADMIN_API_KEY=${{ secrets.PAYLOAD_ADMIN_API_KEY }}
          PUBLIC_SITE_URL=https://simplyenak.com
          EOF

      - name: Sync content from Payload CMS
        if: github.event_name != 'push'
        working-directory: site
        run: npm run sync

      - name: Fix brand voice violations + gate (retry up to 3 times)
        run: |
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "--- Attempt $attempt of $max_attempts ---"
            python3 eval/brand-voice-fix.py --fix
            if python3 eval/brand-voice-gate.py; then
              echo "✅ Brand voice gate passed."
              exit 0
            fi
            echo "⚠️  Gate failed, will retry fix..."
            attempt=$((attempt + 1))
          done
          echo "❌ Brand voice gate failed after $max_attempts attempts."
          exit 1
        # Auto-fix violations, then gate. Loop up to 3x until clean.

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: EN contamination gate (fail if non-English in EN base fields)
        run: |
          REPORT=$(node eval/check-en-contamination.mjs 2>/dev/null || echo "{}")
          CONTAMINATED=$(echo "$REPORT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('contaminatedCount','?'))" 2>/dev/null || echo "?")
          echo "EN contamination: $CONTAMINATED"
          if [ "$CONTAMINATED" != "0" ]; then
            echo "❌ $CONTAMINATED fields have non-English content in EN base fields."
            echo "$REPORT" | python3 -c "import json,sys; [print('  %s/%s.%s [%s]: %s' % (c['collection'],c['id'],c['field'],c['lang'],c['snippet'][:40])) for c in json.load(sys.stdin).get('contaminated',[])[:10]]"
            echo "Fix in Payload CMS admin (EN base fields must be English), then re-sync."
            exit 1
          fi
          echo "✅ EN contamination gate passed."

      - name: Schema conformance check (sync transform inputs vs Payload)
        run: |
          cd site && node --env-file=.env ../eval/check-schema-conformance.mjs --fail 2>&1 | tail -10

      - name: Push translations to Payload CMS
        working-directory: site
        run: |
          node scripts/push-translations-payload.mjs 2>&1 || echo "⚠️ Push failed (non-fatal)"
        env:
          PAYLOAD_URL: https://cms.system.simplyenak.com
          PAYLOAD_EMAIL: ${{ secrets.PAYLOAD_EMAIL }}
          PAYLOAD_PASSWORD: ${{ secrets.PAYLOAD_PASSWORD }}
          PAYLOAD_ADMIN_API_KEY: ${{ secrets.PAYLOAD_ADMIN_API_KEY }}

      - name: Build site
        working-directory: site
        run: npm run build
        env:
          PAYLOAD_URL: https://cms.system.simplyenak.com

      - name: Deploy to staging
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: staging
          directory: site/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: Deploy to production
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: website
          directory: site/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: production

      - name: Deploy CDN Worker
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Worker uses addEventListener (Service Worker format)
          # Metadata references the body part name, which must match the multipart field name
          METADATA='{"body_part":"script","compatibility_date":"2024-12-01"}'
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/simplyenak-cdn-rewriter" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -F "metadata=${METADATA};type=application/json" \
            -F "script=@site/workers/cdn-rewriter.js;type=application/javascript" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('Worker deploy:', 'OK' if r.get('success') else 'FAILED: '+str(r.get('errors',[])))"
