name: Build and Deploy Payload CMS

on:
  push:
    branches: [main]
    paths:
      - 'revamp/backend/**'
      - '.github/workflows/deploy-payload.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || '4040' }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "=== Pulling latest code ==="
            cd /home/maarten/website-optimization
            git pull origin main

            echo "=== Building Docker image ==="
            cd revamp/backend
            docker build -t localhost:5000/simplyenak/website-backend:noloc2 .

            echo "=== Pushing to local registry ==="
            docker push localhost:5000/simplyenak/website-backend:noloc2

            echo "=== Updating Swarm service ==="
            docker service update --image localhost:5000/simplyenak/website-backend:noloc2 simplyenakbackend_payload

            echo "=== Done ==="
