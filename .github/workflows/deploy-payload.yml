name: Build and Push Payload CMS Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'revamp/backend/**'
      - '.github/workflows/deploy-payload.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: revamp/backend
          file: revamp/backend/Dockerfile
          push: true
          tags: simplyenak/website-backend:latest,simplyenak/website-backend:noloc2
          cache-from: type=registry,ref=simplyenak/website-backend:latest
          cache-to: type=inline
