name: Deploy Nous Proxy Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, netcup]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Pull latest code
        run: |
          set -e
          cd /home/maarten/website-optimization
          git fetch origin main
          git reset --hard origin/main
          echo "Checked out: $(git log --oneline -1)"

      - name: Deploy via Cloudflare API
        run: |
          set -e
          cd /home/maarten/website-optimization
          METADATA='{"body_part":"script","compatibility_date":"2025-01-01","workers_dev":true}'
          echo "Account: ${CF_ACCOUNT_ID}"
          RESP=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/nous-proxy" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -F "metadata=${METADATA};type=application/json" \
            -F "script=@site/workers/nous-proxy.js;type=application/javascript" \
            -w "\nHTTP_CODE:%{http_code}")
          echo "Raw response:"
          echo "$RESP"
          CODE=$(echo "$RESP" | tail -1 | cut -d: -f2)
          if [ "$CODE" != "200" ]; then
            echo "FAILED with HTTP $CODE"
            echo "$RESP"
            exit 1
          fi
          echo "Worker deployed successfully"

      - name: Enable workers.dev subdomain for script
        run: |
          set -e
          RESP=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/nous-proxy/subdomain" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"enabled\":true}")
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Subdomain:', 'OK' if d.get('success') else 'WARN: '+str(d.get('errors',[])))"

      - name: Verify worker is reachable
        run: |
          set -e
          # Fetch the account's workers.dev subdomain (not secret — it's in the CF dashboard)
          SUB=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',{}).get('subdomain',''))")
          echo "Account workers.dev subdomain: ${SUB}"
          URL="https://nous-proxy.${SUB}.workers.dev/__health"
          echo "Health URL: ${URL}"
          CODE=$(curl -s -o /tmp/nous-health.json -w "%{http_code}" --max-time 20 "${URL}" || echo "000")
          echo "Health check HTTP: ${CODE}"
          cat /tmp/nous-health.json 2>/dev/null || true

      - name: Bind custom-domain route (fallback to workers.dev)
        run: |
          set -e
          # Find the zone for system.simplyenak.com
          ZONE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=simplyenak.com" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')")
          echo "Zone ID: ${ZONE}"
          if [ -n "${ZONE}" ]; then
            # Check existing routes
            ROUTES=$(curl -s "https://api.cloudflare.com/client/v4/zones/${ZONE}/workers/routes" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")
            echo "Existing routes: $(echo "$ROUTES" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('result',[])))" 2>/dev/null || echo 0)"
            # Create route: nous.system.simplyenak.com -> nous-proxy
            RESP=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/zones/${ZONE}/workers/routes" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"pattern":"nous.system.simplyenak.com/*","script":"nous-proxy"}')
            echo "Route bind: $(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('OK' if d.get('success') else 'FAIL: '+str(d.get('errors',[])))")"
          else
            echo "No zone found for simplyenak.com — workers.dev binding is the only option"
          fi

      - name: Verify custom-domain route
        run: |
          set -e
          CODE=$(curl -s -o /tmp/nous-route.json -w "%{http_code}" --max-time 20 "https://nous.system.simplyenak.com/__health" || echo "000")
          echo "nous.system.simplyenak.com/__health -> HTTP ${CODE}"
          cat /tmp/nous-route.json 2>/dev/null || true
