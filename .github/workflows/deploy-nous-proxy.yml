name: Deploy Nous Proxy Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, netcup]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Pull latest code
        run: |
          set -e
          cd /home/maarten/website-optimization
          git fetch origin main
          git reset --hard origin/main
          echo "Checked out: $(git log --oneline -1)"

      - name: Deploy via Cloudflare API
        run: |
          set -e
          cd /home/maarten/website-optimization
          METADATA='{"body_part":"script","compatibility_date":"2025-01-01","workers_dev":true}'
          echo "Account: ${CF_ACCOUNT_ID}"
          RESP=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/nous-proxy" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -F "metadata=${METADATA};type=application/json" \
            -F "script=@site/workers/nous-proxy.js;type=application/javascript" \
            -w "\nHTTP_CODE:%{http_code}")
          echo "Raw response:"
          echo "$RESP"
          CODE=$(echo "$RESP" | tail -1 | cut -d: -f2)
          if [ "$CODE" != "200" ]; then
            echo "FAILED with HTTP $CODE"
            echo "$RESP"
            exit 1
          fi
          echo "Worker deployed successfully"

      - name: Enable workers.dev subdomain for script
        run: |
          set -e
          RESP=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/nous-proxy/subdomain" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"enabled\":true}")
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Subdomain:', 'OK' if d.get('success') else 'WARN: '+str(d.get('errors',[])))"

      - name: Verify worker is reachable
        run: |
          set -e
          # Fetch the account's workers.dev subdomain (not secret — it's in the CF dashboard)
          SUB=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',{}).get('subdomain',''))")
          echo "Account workers.dev subdomain: ${SUB}"
          URL="https://nous-proxy.${SUB}.workers.dev/__health"
          echo "Health URL: ${URL}"
          CODE=$(curl -s -o /tmp/nous-health.json -w "%{http_code}" --max-time 20 "${URL}" || echo "000")
          echo "Health check HTTP: ${CODE}"
          cat /tmp/nous-health.json 2>/dev/null || true