name: Deploy Nous Proxy Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, netcup]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Pull latest code
        run: |
          set -e
          cd /home/maarten/website-optimization
          git fetch origin main
          git reset --hard origin/main
          echo "Checked out: $(git log --oneline -1)"

      - name: Deploy via Cloudflare API
        run: |
          set -e
          cd /home/maarten/website-optimization
          METADATA='{"body_part":"script","compatibility_date":"2025-01-01","workers_dev":true}'
          echo "Account: ${CF_ACCOUNT_ID}"
          RESP=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/nous-proxy" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -F "metadata=${METADATA};type=application/json" \
            -F "script=@site/workers/nous-proxy.js;type=application/javascript" \
            -w "\nHTTP_CODE:%{http_code}")
          echo "Raw response:"
          echo "$RESP"
          CODE=$(echo "$RESP" | tail -1 | cut -d: -f2)
          if [ "$CODE" != "200" ]; then
            echo "FAILED with HTTP $CODE"
            echo "$RESP"
            exit 1
          fi
          echo "Worker deployed successfully"

      - name: Get workers.dev subdomain
        run: |
          set -e
          SUB=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result']['subdomain'])")
          echo "Subdomain: $SUB"
          echo "SUB=$SUB" >> $GITHUB_ENV

      - name: Add workers.dev route
        run: |
          set -e
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/routes" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"pattern\":\"nous-proxy.${SUB}.workers.dev\",\"script\":\"nous-proxy\"}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Route:', 'OK' if d.get('success') else 'WARN: '+str(d.get('errors',[])))"